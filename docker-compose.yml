# Отдельный Compose-проект. Не пересекается с ~/openclaw и ~/openclaw-team: своё имя, своя сеть, свои тома.
# Потолок памяти стека — 600 МБ (app 380 + staging 100 + caddy 120).
name: talk-proto

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - app_data:/data
    expose:
      - "3000"
    mem_limit: 380m
    memswap_limit: 380m
    networks: [talk]

  # Тестовый стенд (staging.talk.perveev.com): тот же код, своя база на условных данных, без ключей —
  # DaData и отчётность в песочнице, распознавание PDF выключено. Сюда выкатывается и проверяется до рабочего сайта:
  #   docker compose up -d --build staging   (проверка)   docker compose up -d --build app
  staging:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      NODE_OPTIONS: --max-old-space-size=64
      CONNECTOR_DADATA_MODE: sandbox
      CONNECTOR_FIN_MODE: sandbox
    volumes:
      - staging_data:/data
    expose:
      - "3000"
    mem_limit: 100m
    memswap_limit: 100m
    networks: [talk]

  # Разовое обучение раннего предупреждения (профиль train — не поднимается `docker compose up`):
  #   docker compose run --rm ews-train python gen_data.py --clients 2500 --out pool.json
  # Код и данные — из ./seed (данные в git не попадают), выгрузка заказчика — каталог EWS_CUSTOMER_DIR (права 700).
  ews-train:
    profiles: [train]
    build: { context: seed/ews, dockerfile: Dockerfile.train }
    image: talk-proto-ews-train
    volumes:
      - ./seed:/work/seed
      - ${EWS_CUSTOMER_DIR:-./customer}:/data/customer
    network_mode: none
    mem_limit: 900m
    memswap_limit: 900m

  # То же с pyarrow и доступом в сеть: выгрузка RFSD и разметка DaData (seed/ews_open)
  ews-open:
    profiles: [train]
    build: { context: seed/ews, dockerfile: Dockerfile.train, args: { OPEN: "1" } }
    image: talk-proto-ews-open
    working_dir: /work/seed/ews_open
    environment:
      DADATA_TOKEN: ${DADATA_TOKEN:-}   # из .env; другие ключи в контейнер не передаются
    volumes:
      - ./seed:/work/seed
    mem_limit: 900m
    memswap_limit: 900m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-talk.perveev.com}
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.talk.perveev.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 120m
    memswap_limit: 120m
    networks: [talk]

networks:
  talk:
    name: talk-proto

volumes:
  app_data:
  staging_data:
  caddy_data:
  caddy_config:
